<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <!-- APP CONTAINER -->
    <div id="app" class="w-full relative">
        
        <!-- LOADING VIEW -->
        <div id="loading-view" class="flex flex-col items-center justify-center h-screen bg-gray-50 text-emerald-600">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mb-4"></div>
            <p id="loading-text" class="text-gray-500 text-sm">Connecting to Mess Manager...</p>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="hidden min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md fade-in">
                <div class="flex justify-center mb-6">
                    <div class="bg-emerald-100 p-4 rounded-full">
                        <i data-lucide="shopping-cart" class="w-10 h-10 text-emerald-600"></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Mess Manager</h1>
                <p class="text-center text-gray-500 mb-8">Keep track of daily shopping & expenses together.</p>
                
                <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm border border-red-200 flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <span id="login-error-text"></span>
                </div>

                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">What's your name?</label>
                        <input 
                            type="text"
                            id="username-input"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition"
                            placeholder="e.g. Rahul, Priya..."
                            required
                        />
                    </div>
                    <button 
                        type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md"
                    >
                        Join Mess
                    </button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="hidden min-h-screen bg-gray-50 pb-20">
            <!-- Header -->
            <div class="bg-emerald-600 text-white p-6 rounded-b-3xl shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold">Mess Expense</h1>
                        <p class="text-emerald-100 text-sm">Welcome, <span id="display-username">User</span></p>
                    </div>
                    <button id="logout-btn" class="p-2 bg-emerald-700 rounded-full hover:bg-emerald-800 transition">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Total Card -->
                <div class="bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <p class="text-emerald-100 text-xs uppercase tracking-wider font-semibold">Overall Total</p>
                        <p class="text-3xl font-bold">₹<span id="total-spent">0.00</span></p>
                    </div>
                    <div class="bg-white/20 p-3 rounded-full">
                        <i data-lucide="dollar-sign" class="w-6 h-6 text-white"></i>
                    </div>
                </div>
            </div>

            <div class="max-w-3xl mx-auto px-4 -mt-6">
                
                <!-- Input Form -->
                <div class="bg-white rounded-xl shadow-lg p-5 mb-6 fade-in">
                    <div id="dashboard-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm border border-red-200 flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i>
                        <span id="dashboard-error-text"></span>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-700 flex items-center gap-2" id="form-title">
                            <i data-lucide="plus" class="text-emerald-500 w-5 h-5" id="form-icon"></i>
                            <span id="form-title-text">Add New Item</span>
                        </h3>
                        <button id="cancel-edit-btn" class="hidden text-xs text-red-500 font-medium hover:underline">
                            Cancel Edit
                        </button>
                    </div>
                    
                    <form id="expense-form" class="flex flex-col gap-3">
                        <input type="hidden" id="edit-id">
                        <div class="flex gap-3">
                            <input 
                                type="text" 
                                id="item-name"
                                placeholder="Item name (e.g. Milk, Eggs)" 
                                class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                required
                            />
                            <input 
                                type="number" 
                                id="item-cost"
                                placeholder="₹ Cost" 
                                class="w-24 p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                required
                                step="0.01"
                            />
                        </div>
                        <button 
                            type="submit" 
                            id="submit-btn"
                            class="w-full py-3 rounded-lg font-semibold text-white shadow-sm transition-colors flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700"
                        >
                            <i data-lucide="plus" class="w-5 h-5" id="btn-icon"></i> 
                            <span id="btn-text">Add to List</span>
                        </button>
                    </form>
                </div>

                <!-- View Toggle & List -->
                <div class="space-y-3">
                    <div class="flex justify-between items-end mb-2">
                        <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wide ml-1">Records</h3>
                        
                        <!-- View Toggle -->
                        <div class="flex bg-gray-200 p-1 rounded-lg">
                            <button id="view-daily" class="px-4 py-1.5 text-xs font-semibold rounded-md shadow-sm bg-white text-emerald-700 transition-all">
                                Daily
                            </button>
                            <button id="view-monthly" class="px-4 py-1.5 text-xs font-semibold rounded-md text-gray-500 hover:text-gray-700 transition-all">
                                Monthly
                            </button>
                        </div>
                    </div>

                    <div id="expenses-list" class="space-y-6 pb-10">
                        <!-- Items injected here -->
                    </div>
                    
                    <div id="empty-state" class="hidden text-center py-10 bg-white rounded-xl shadow-sm border border-dashed border-gray-300">
                        <p class="text-gray-400">No expenses added yet.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- DELETE MODAL -->
        <div id="delete-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm fade-in">
            <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                <div class="flex flex-col items-center text-center mb-6">
                    <div class="bg-red-100 p-3 rounded-full mb-4">
                        <i data-lucide="trash-2" class="w-8 h-8 text-red-600"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-800">Delete Item?</h3>
                    <p class="text-gray-500 text-sm mt-2">Are you sure you want to remove this expense? This action cannot be undone.</p>
                </div>
                <div class="flex gap-3">
                    <button id="cancel-delete-btn" class="flex-1 py-2.5 border border-gray-300 rounded-lg font-semibold text-gray-700 hover:bg-gray-50 transition">
                        Cancel
                    </button>
                    <button id="confirm-delete-btn" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 rounded-lg font-semibold text-white shadow-md transition flex justify-center items-center">
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, initializeFirestore 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { 
            getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        // --- Configuration ---
        const apiKey = ""; // Runtime handles this
        
        // FOR CANVAS ENVIRONMENT (DO NOT DELETE)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        let firebaseConfig;

        if (typeof __firebase_config !== 'undefined') {
            // Case 1: Running inside Canvas (Automatic)
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // Case 2: External Deployment (Netlify, Vercel, etc.)
            // --- PASTE YOUR FIREBASE CONFIGURATION HERE FROM STEP 4 OF THE GUIDE ---
            firebaseConfig = {
                apiKey: "AIzaSyC7z-IuvKCSer2rTRatJW5DRtO9NDZdPeg",
                authDomain: "messjyotirmoy.firebaseapp.com",
                projectId: "messjyotirmoy",
                storageBucket: "messjyotirmoy.firebasestorage.app",
                messagingSenderId: "13122110126",
                appId: "1:13122110126:web:bb6d03aa476dbf5929a33f"
            };
        }
        
        // --- Initialization ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Connectivity settings
        let db;
        try {
            db = initializeFirestore(app, { 
                experimentalForceLongPolling: true,
                useFetchStreams: false 
            });
        } catch (e) {
            console.log("Using existing Firestore instance");
            db = getFirestore(app);
        }

        // --- State ---
        let state = {
            user: null,
            username: '',
            expenses: [],
            editId: null,
            deleteTargetId: null, // Track item to delete
            loading: true,
            hasJoined: false,
            viewMode: 'daily' // 'daily' or 'monthly'
        };

        // --- UI References ---
        const views = {
            loading: document.getElementById('loading-view'),
            login: document.getElementById('login-view'),
            dashboard: document.getElementById('dashboard-view')
        };
        const elements = {
            loginForm: document.getElementById('login-form'),
            usernameInput: document.getElementById('username-input'),
            displayUsername: document.getElementById('display-username'),
            logoutBtn: document.getElementById('logout-btn'),
            expenseForm: document.getElementById('expense-form'),
            itemName: document.getElementById('item-name'),
            itemCost: document.getElementById('item-cost'),
            editId: document.getElementById('edit-id'),
            submitBtn: document.getElementById('submit-btn'),
            formTitle: document.getElementById('form-title'), 
            cancelEditBtn: document.getElementById('cancel-edit-btn'),
            expensesList: document.getElementById('expenses-list'),
            emptyState: document.getElementById('empty-state'),
            totalSpent: document.getElementById('total-spent'),
            loginError: document.getElementById('login-error'),
            loginErrorText: document.getElementById('login-error-text'),
            dashError: document.getElementById('dashboard-error'),
            dashErrorText: document.getElementById('dashboard-error-text'),
            viewDailyBtn: document.getElementById('view-daily'),
            viewMonthlyBtn: document.getElementById('view-monthly'),
            // Modal Elements
            deleteModal: document.getElementById('delete-modal'),
            cancelDeleteBtn: document.getElementById('cancel-delete-btn'),
            confirmDeleteBtn: document.getElementById('confirm-delete-btn')
        };

        // --- Auth Setup ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
                showError("Could not connect to authentication service. Try refreshing.", true);
            }
        }

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) {
                const savedName = localStorage.getItem(`mess_user_${appId}`);
                if (savedName) {
                    state.username = savedName;
                    state.hasJoined = true;
                }
                setupDataListener();
            }
            state.loading = false;
            render();
        });

        // --- Data Logic ---
        function setupDataListener() {
            if (!state.user) return;

            // Uses 'appId' which defaults to 'default-app-id' in external mode
            // This is perfectly fine and safe for personal use.
            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'mess_expenses');

            onSnapshot(collectionRef, (snapshot) => {
                const data = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                // Sort Newest First
                data.sort((a, b) => new Date(b.date) - new Date(a.date));
                state.expenses = data;
                hideError(false);
                renderDashboardData();
            }, (err) => {
                console.error("Data fetch error:", err);
                showError("Connection issues detected. Trying to reconnect...", false);
            });
        }

        // --- View Toggles ---
        elements.viewDailyBtn.addEventListener('click', () => {
            state.viewMode = 'daily';
            updateViewToggleUI();
            renderDashboardData();
        });

        elements.viewMonthlyBtn.addEventListener('click', () => {
            state.viewMode = 'monthly';
            updateViewToggleUI();
            renderDashboardData();
        });

        function updateViewToggleUI() {
            if (state.viewMode === 'daily') {
                elements.viewDailyBtn.classList.add('bg-white', 'text-emerald-700', 'shadow-sm');
                elements.viewDailyBtn.classList.remove('text-gray-500', 'hover:text-gray-700');
                
                elements.viewMonthlyBtn.classList.remove('bg-white', 'text-emerald-700', 'shadow-sm');
                elements.viewMonthlyBtn.classList.add('text-gray-500', 'hover:text-gray-700');
            } else {
                elements.viewMonthlyBtn.classList.add('bg-white', 'text-emerald-700', 'shadow-sm');
                elements.viewMonthlyBtn.classList.remove('text-gray-500', 'hover:text-gray-700');
                
                elements.viewDailyBtn.classList.remove('bg-white', 'text-emerald-700', 'shadow-sm');
                elements.viewDailyBtn.classList.add('text-gray-500', 'hover:text-gray-700');
            }
        }

        // --- Actions ---
        
        elements.loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = elements.usernameInput.value.trim();
            if (!name) return;
            state.username = name;
            state.hasJoined = true;
            localStorage.setItem(`mess_user_${appId}`, name);
            render();
        });

        elements.logoutBtn.addEventListener('click', () => {
            localStorage.removeItem(`mess_user_${appId}`);
            state.username = '';
            state.hasJoined = false;
            render();
        });

        elements.expenseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = elements.itemName.value;
            const cost = elements.itemCost.value;
            
            if (!name || !cost) return;

            try {
                const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'mess_expenses');
                
                if (state.editId) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mess_expenses', state.editId);
                    await updateDoc(docRef, {
                        item: name,
                        cost: parseFloat(cost),
                        updatedAt: new Date().toISOString()
                    });
                    cancelEdit();
                } else {
                    await addDoc(collectionRef, {
                        item: name,
                        cost: parseFloat(cost),
                        addedBy: state.username,
                        userId: state.user.uid,
                        date: new Date().toISOString()
                    });
                    elements.itemName.value = '';
                    elements.itemCost.value = '';
                }
            } catch (err) {
                console.error("Save error:", err);
                showError("Error saving data. Check your connection.", false);
            }
        });

        elements.cancelEditBtn.addEventListener('click', cancelEdit);

        function cancelEdit() {
            state.editId = null;
            elements.itemName.value = '';
            elements.itemCost.value = '';
            updateFormState();
        }

        // --- Modal & Action Handlers ---

        document.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                state.deleteTargetId = deleteBtn.dataset.id;
                elements.deleteModal.classList.remove('hidden');
                return;
            }

            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const id = editBtn.dataset.id;
                const expense = state.expenses.find(x => x.id === id);
                if (expense) {
                    state.editId = id;
                    elements.itemName.value = expense.item;
                    elements.itemCost.value = expense.cost;
                    updateFormState();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        });

        elements.cancelDeleteBtn.addEventListener('click', () => {
            state.deleteTargetId = null;
            elements.deleteModal.classList.add('hidden');
        });

        elements.confirmDeleteBtn.addEventListener('click', async () => {
            if (!state.deleteTargetId) return;

            // Show Loading State on Button
            const originalText = elements.confirmDeleteBtn.innerHTML;
            elements.confirmDeleteBtn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
            elements.confirmDeleteBtn.disabled = true;
            lucide.createIcons();

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mess_expenses', state.deleteTargetId);
                await deleteDoc(docRef);
                elements.deleteModal.classList.add('hidden');
            } catch(err) {
                console.error(err);
                showError("Could not delete. Check connection.", false);
                elements.deleteModal.classList.add('hidden');
            } finally {
                // Reset Button
                elements.confirmDeleteBtn.innerHTML = originalText;
                elements.confirmDeleteBtn.disabled = false;
                state.deleteTargetId = null;
            }
        });


        // --- Rendering Logic ---

        function render() {
            if (state.loading) {
                views.loading.classList.remove('hidden');
                views.login.classList.add('hidden');
                views.dashboard.classList.add('hidden');
            } else if (!state.hasJoined) {
                views.loading.classList.add('hidden');
                views.login.classList.remove('hidden');
                views.dashboard.classList.add('hidden');
                lucide.createIcons();
            } else {
                views.loading.classList.add('hidden');
                views.login.classList.add('hidden');
                views.dashboard.classList.remove('hidden');
                
                elements.displayUsername.textContent = state.username;
                renderDashboardData();
            }
        }

        function renderDashboardData() {
            // 1. Overall Total
            const total = state.expenses.reduce((acc, curr) => acc + (curr.cost || 0), 0);
            elements.totalSpent.textContent = total.toFixed(2);

            // 2. Grouping Logic
            if (state.expenses.length === 0) {
                elements.expensesList.innerHTML = '';
                elements.emptyState.classList.remove('hidden');
                return;
            }

            elements.emptyState.classList.add('hidden');
            
            const grouped = {};
            const keys = [];

            state.expenses.forEach(ex => {
                const d = new Date(ex.date);
                let key, label;

                if (state.viewMode === 'daily') {
                    // Group by Date string (e.g., "Mon Jan 12 2026")
                    key = d.toDateString();
                    label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                } else {
                    // Group by Month (e.g., "2026-0")
                    key = `${d.getFullYear()}-${d.getMonth()}`;
                    label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                }

                if (!grouped[key]) {
                    grouped[key] = {
                        label: label,
                        total: 0,
                        items: [],
                        sortTime: d.getTime() // used to sort groups
                    };
                    keys.push(key);
                }
                
                grouped[key].items.push(ex);
                grouped[key].total += ex.cost;
            });

            // If daily, sorting keys by Date desc is already mostly handled by data sort, 
            // but let's be safe and sort the groups array
            keys.sort((a, b) => grouped[b].sortTime - grouped[a].sortTime);

            // 3. Render Groups
            elements.expensesList.innerHTML = keys.map(key => {
                const group = grouped[key];
                
                // Render Items inside group
                const itemsHtml = group.items.map(expense => `
                    <div class="flex justify-between items-center py-3 border-b border-gray-100 last:border-0 hover:bg-gray-50 px-4 transition">
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="font-medium text-gray-700">${escapeHtml(expense.item)}</span>
                            </div>
                            <div class="text-xs text-gray-400 flex items-center gap-2 mt-0.5">
                                <span class="flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> ${escapeHtml(expense.addedBy)}</span>
                                ${state.viewMode === 'monthly' ? `<span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${new Date(expense.date).getDate()}th</span>` : ''}
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <span class="text-emerald-600 font-bold">₹${expense.cost}</span>
                            <div class="flex gap-2 opacity-50 hover:opacity-100 transition-opacity">
                                <button class="edit-btn text-blue-400 hover:text-blue-600" data-id="${expense.id}" title="Edit"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                                <button class="delete-btn text-red-400 hover:text-red-600" data-id="${expense.id}" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="fade-in">
                        <!-- Group Header -->
                        <div class="bg-gray-100 rounded-t-xl px-4 py-2 flex justify-between items-center border border-gray-200 border-b-0">
                            <span class="text-sm font-bold text-gray-600 uppercase tracking-wide flex items-center gap-2">
                                <i data-lucide="${state.viewMode === 'daily' ? 'calendar-days' : 'calendar'}" class="w-4 h-4"></i>
                                ${group.label}
                            </span>
                            <span class="text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded text-sm">
                                Total: ₹${group.total.toFixed(2)}
                            </span>
                        </div>
                        <!-- Group Body -->
                        <div class="bg-white rounded-b-xl border border-gray-200 shadow-sm overflow-hidden">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        // --- FIXED FUNCTION ---
        function updateFormState() {
            // Using stable container references instead of accessing potentially deleted child nodes
            // This fixes the "Cannot set properties of null" error
            
            if (state.editId) {
                elements.submitBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                elements.submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                
                // Set innerHTML directly on stable parents
                elements.submitBtn.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i> <span id="btn-text">Update Entry</span>`;
                elements.formTitle.innerHTML = `<i data-lucide="edit-2" class="text-blue-500 w-5 h-5"></i> <span id="form-title-text">Edit Item</span>`;
                
                elements.cancelEditBtn.classList.remove('hidden');
            } else {
                elements.submitBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                elements.submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                
                // Set innerHTML directly on stable parents
                elements.submitBtn.innerHTML = `<i data-lucide="plus" class="w-5 h-5"></i> <span id="btn-text">Add to List</span>`;
                elements.formTitle.innerHTML = `<i data-lucide="plus" class="text-emerald-500 w-5 h-5"></i> <span id="form-title-text">Add New Item</span>`;
                
                elements.cancelEditBtn.classList.add('hidden');
            }
            
            // Re-render icons since we just injected new <i> tags
            lucide.createIcons();
        }

        // --- Utilities ---
        function showError(msg, isLogin) {
            if (isLogin) {
                elements.loginError.classList.remove('hidden');
                elements.loginErrorText.textContent = msg;
            } else {
                elements.dashError.classList.remove('hidden');
                elements.dashErrorText.textContent = msg;
            }
        }

        function hideError(isLogin) {
            if (isLogin) {
                elements.loginError.classList.add('hidden');
            } else {
                elements.dashError.classList.add('hidden');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initAuth();

    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2" viewBox="0 0 900 2">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#022c22;stop-opacity:0"/>
      <stop offset="15%" style="stop-color:#34d399;stop-opacity:1">
        <animate attributeName="stop-color" values="#34d399;#2dd4bf;#fbbf24;#34d399" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#2dd4bf;stop-opacity:1">
        <animate attributeName="stop-color" values="#2dd4bf;#fbbf24;#34d399;#2dd4bf" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="85%" style="stop-color:#fbbf24;stop-opacity:1">
        <animate attributeName="stop-color" values="#fbbf24;#34d399;#2dd4bf;#fbbf24" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#022c22;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="2" fill="url(#divGrad)" rx="1"/>
</svg>

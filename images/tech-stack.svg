<svg xmlns="http://www.w3.org/2000/svg" width="900" height="135" viewBox="0 0 900 135">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#02110c"/>
      <stop offset="100%" style="stop-color:#062319"/>
    </linearGradient>
    <filter id="tsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="135" fill="url(#tsBg)" rx="12"/>

  <!-- Row 1: Frontend -->
  <text x="20" y="30" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="2">FRONTEND</text>

  <g transform="translate(120, 15)" filter="url(#tsGlow)">
    <rect width="65" height="26" rx="6" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="32.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f97316" font-weight="600">HTML5</text>
  </g>

  <g transform="translate(195, 15)" filter="url(#tsGlow)">
    <rect width="95" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="47.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#38bdf8" font-weight="600">Tailwind CSS</text>
  </g>

  <g transform="translate(300, 15)" filter="url(#tsGlow)">
    <rect width="95" height="26" rx="6" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="47.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#60a5fa" font-weight="600">React Native</text>
  </g>

  <g transform="translate(405, 15)" filter="url(#tsGlow)">
    <rect width="75" height="26" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="37.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#e2e8f0" font-weight="600">Expo SDK</text>
  </g>

  <g transform="translate(490, 15)" filter="url(#tsGlow)">
    <rect width="65" height="26" rx="6" fill="none" stroke="#facc15" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <text x="32.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#facc15" font-weight="600">ES6+ JS</text>
  </g>

  <!-- Row 2: Backend -->
  <text x="20" y="72" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="2">BACKEND &amp; DB</text>

  <g transform="translate(140, 57)" filter="url(#tsGlow)">
    <rect width="100" height="26" rx="6" fill="none" stroke="#fb923c" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#fb923c" font-weight="600">Firebase Auth</text>
  </g>

  <g transform="translate(250, 57)" filter="url(#tsGlow)">
    <rect width="110" height="26" rx="6" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34d399" font-weight="600">Cloud Firestore</text>
  </g>

  <g transform="translate(360, 57)" filter="url(#tsGlow)">
    <rect width="110" height="26" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#22d3ee" font-weight="600">Google Sign-In</text>
  </g>

  <g transform="translate(480, 57)" filter="url(#tsGlow)">
    <rect width="100" height="26" rx="6" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ec4899" font-weight="600">Expo Updates</text>
  </g>

  <!-- Row 3: Security & Utils -->
  <text x="20" y="114" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="2">SECURITY &amp; UTILS</text>

  <g transform="translate(150, 99)" filter="url(#tsGlow)">
    <rect width="110" height="26" rx="6" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#c084fc" font-weight="600">Firestore Rules</text>
  </g>

  <g transform="translate(270, 99)" filter="url(#tsGlow)">
    <rect width="110" height="26" rx="6" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#2dd4bf" font-weight="600">Email Whitelist</text>
  </g>

  <g transform="translate(390, 99)" filter="url(#tsGlow)">
    <rect width="105" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="52.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#38bdf8" font-weight="600">Async Storage</text>
  </g>

  <g transform="translate(505, 99)" filter="url(#tsGlow)">
    <rect width="85" height="26" rx="6" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <text x="42.5" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f43f5e" font-weight="600">Expo Print</text>
  </g>

  <!-- Floating decorative stars/orbs -->
  <circle cx="750" cy="30" r="2" fill="#2dd4bf" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="65" r="1.5" fill="#fbbf24" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="100" r="2.5" fill="#34d399" opacity="0.2"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="110" r="1" fill="#facc15" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="40" r="1.5" fill="#2dd4bf" opacity="0.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>

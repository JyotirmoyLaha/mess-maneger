<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#02110c"/>
      <stop offset="100%" style="stop-color:#062319"/>
    </linearGradient>
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#archBg)" rx="12"/>
  <rect width="900" height="220" fill="none" stroke="#2dd4bf" stroke-width="1.25" rx="12" opacity="0.15"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="4" font-weight="600">
    SYSTEM ARCHITECTURE
  </text>

  <!-- Central node: Frontend PWA -->
  <g filter="url(#neonGlow)">
    <rect x="350" y="75" width="200" height="60" rx="10" fill="#02110c" stroke="#2dd4bf" stroke-width="1.75" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="102" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#2dd4bf" font-weight="bold">
      📱 Frontend App (PWA)
    </text>
    <text x="450" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">
      HTML5 · Tailwind · ES6 JS
    </text>
  </g>

  <!-- Left node: Firebase Auth (Secure Authentication) -->
  <g filter="url(#neonGlow)">
    <rect x="60" y="75" width="180" height="60" rx="10" fill="#02110c" stroke="#fbbf24" stroke-width="1.5" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="150" y="102" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#fbbf24" font-weight="bold">
      🔐 Firebase Auth
    </text>
    <text x="150" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">
      Google OAuth · Whitelist
    </text>
  </g>

  <!-- Right node: Cloud Firestore (Real-time Database) -->
  <g filter="url(#neonGlow)">
    <rect x="660" y="75" width="180" height="60" rx="10" fill="#02110c" stroke="#34d399" stroke-width="1.5" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="102" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#34d399" font-weight="bold">
      🔥 Cloud Firestore
    </text>
    <text x="750" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">
      NoSQL · Security Rules
    </text>
  </g>

  <!-- Connection Lines and Flow Animation -->
  <!-- Auth flow -->
  <line x1="240" y1="105" x2="350" y2="105" stroke="#fbbf24" stroke-width="1.25" stroke-dasharray="6,4" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <!-- Animated packet left to center -->
  <circle r="3.5" fill="#fbbf24" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="cx" values="60;350" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="105;105" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Realtime Data sync flow -->
  <path d="M 550 95 L 660 95" stroke="#34d399" stroke-width="1.25" stroke-dasharray="6,4" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 660 115 L 550 115" stroke="#2dd4bf" stroke-width="1.25" stroke-dasharray="6,4" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Data packets right and left -->
  <circle r="3.5" fill="#34d399" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="cx" values="550;660" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="95;95" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#2dd4bf" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="cx" values="660;550" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="115;115" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Sub-components/Details below -->
  <!-- Security Rules component -->
  <g filter="url(#neonGlow)">
    <rect x="585" y="165" width="140" height="35" rx="8" fill="#02110c" stroke="#14b8a6" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="655" y="186" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#2dd4bf">
      🔒 Security Rules
    </text>
  </g>

  <!-- PDF Exporter -->
  <g filter="url(#neonGlow)">
    <rect x="175" y="165" width="140" height="35" rx="8" fill="#02110c" stroke="#fbbf24" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="245" y="186" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#fbbf24">
      📄 PDF Export
    </text>
  </g>

  <!-- Local Environment (Vite/Dotenv) -->
  <g filter="url(#neonGlow)">
    <rect x="380" y="165" width="140" height="35" rx="8" fill="#02110c" stroke="#34d399" stroke-width="1" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="186" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#34d399">
      ⚙️ Env Config
    </text>
  </g>

  <!-- Connectors to sub-components -->
  <line x1="420" y1="135" x2="245" y2="165" stroke="#fbbf24" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="450" y1="135" x2="450" y2="165" stroke="#34d399" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="480" y1="135" x2="655" y2="165" stroke="#2dd4bf" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.5"/>
</svg>
